name: Test

on: [push, pull_request]

jobs:
  test:
    name: RSpec
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
        gemfile: [gemfiles/carrierwave-2.gemfile]
        include:
          - ruby: '2.1'
            gemfile: gemfiles/carrierwave-1.gemfile
          - ruby: '2.2'
            gemfile: gemfiles/carrierwave-1.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/carrierwave-3.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/carrierwave-master.gemfile
          - ruby: 'ruby-head'
            gemfile: gemfiles/carrierwave-3.gemfile
          - ruby: 'jruby-head'
            gemfile: gemfiles/carrierwave-3.gemfile
    runs-on: ubuntu-24.04
    permissions:
      id-token: 'write'
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
      GCLOUD_BUCKET: ${{ secrets.GCLOUD_BUCKET }}
      JRUBY_OPTS: --debug
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Setup Google Cloud Platform service account credential
        run: |
          mkdir -p ${HOME}/.config/gcloud
          echo "${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}" | base64 -d > ${HOME}/.config/gcloud/application_default_credentials.json
      - name: Set BUILD_ID
        run: echo "BUILD_ID=$(echo '${{ github.run_id }}${{ toJSON(matrix) }}' | shasum | cut -c 1-8)" >> $GITHUB_ENV
      - name: Run RSpec
        run: bundle exec rake spec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby-head'
          bundler-cache: true
      - name: Run check
        env:
          RUBOCOP_FORMAT: github
        run: bundle exec rake rubocop
